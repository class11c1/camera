
<!-- index.html -->
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camera Access</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:20px;background:#10111b;color:white;
  font-family:Arial,sans-serif;text-align:center
}
h2{color:#a78bfa}
video,img{
  width:100%;max-height:65vh;object-fit:contain;
  background:#000;border-radius:16px;margin:15px 0
}
button{
  border:0;border-radius:12px;padding:13px 16px;
  margin:5px;background:#8b5cf6;color:white;
  font-size:15px;font-weight:bold
}
#status{color:#c4b5fd;font-size:14px}
</style>
</head>
<body>
<h2>📷 Camera Access</h2>
<p id="status">Nhấn Bật camera để bắt đầu</p>

<video id="video" autoplay playsinline muted></video>

<div>
  <button onclick="startCamera()">Bật camera</button>
  <button onclick="switchCamera()">Đổi camera</button>
  <button onclick="takePhoto()">Chụp ảnh</button>
  <button onclick="stopCamera()">Tắt camera</button>
</div>

<canvas id="canvas" hidden></canvas>
<img id="photo" hidden alt="Ảnh vừa chụp">

<script>
const video = document.getElementById('video');
const statusText = document.getElementById('status');
const canvas = document.getElementById('canvas');
const photo = document.getElementById('photo');

let stream = null;
let facingMode = 'environment';

async function startCamera() {
  if (!navigator.mediaDevices?.getUserMedia) {
    statusText.textContent =
      'Trình duyệt không hỗ trợ hoặc trang chưa dùng HTTPS.';
    return;
  }

  stopCamera();

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: facingMode } },
      audio: false
    });

    video.srcObject = stream;
    await video.play();
    statusText.textContent = 'Camera đang hoạt động';
    photo.hidden = true;
  } catch (err) {
    statusText.textContent =
      'Không mở được camera: ' + err.message;
  }
}

async function switchCamera() {
  facingMode = facingMode === 'environment'
    ? 'user' : 'environment';
  await startCamera();
}

function takePhoto() {
  if (!stream || !video.videoWidth) {
    statusText.textContent = 'Hãy bật camera trước!';
    return;
  }

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(
    video, 0, 0, canvas.width, canvas.height
  );

  photo.src = canvas.toDataURL('image/png');
  photo.hidden = false;
  statusText.textContent = 'Đã chụp ảnh thành công';
}

function stopCamera() {
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }
  video.srcObject = null;
  statusText.textContent = 'Camera đã tắt';
}
</script>
</body>
</html>
